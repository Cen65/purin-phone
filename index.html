<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0d10" />
    <meta name="description" content="Purin —— 一部跑在浏览器里的 AI 小手机" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Purin" />
    <title>Purin</title>
    <script>
      // 拦截 Netlify 免费套餐注入的右下角徽标脚本（HUD 在 HTML 响应末尾被追加）
      (function () {
        var kill = function (node) {
          if (node && node.nodeType === 1 && node.tagName === "SCRIPT") {
            var src = node.getAttribute && node.getAttribute("src");
            if (src && src.indexOf("/.netlify/scripts/hud") === 0) node.remove();
          }
        };
        new MutationObserver(function (records) {
          for (var i = 0; i < records.length; i++) {
            var added = records[i].addedNodes;
            for (var j = 0; j < added.length; j++) kill(added[j]);
          }
        }).observe(document.documentElement, { childNodes: true, subtree: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
