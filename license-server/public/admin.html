<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>激活码管理后台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #0f1216; color: #e6e9ee; min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #8b93a1; font-size: 13px; margin-bottom: 20px; }
  .card { background: #171b21; border: 1px solid #262c35; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #8b93a1; }
  input, select { background: #0f1216; border: 1px solid #2c333e; color: #e6e9ee; border-radius: 8px; padding: 8px 10px; font-size: 14px; min-width: 120px; }
  input:focus, select:focus { outline: 1px solid #4f8cff; }
  button { background: #2b6cff; border: none; color: #fff; border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; }
  button:hover { background: #3d7aff; }
  button.ghost { background: transparent; border: 1px solid #2c333e; color: #aab3c0; }
  button.danger { background: #c0392b; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  .stat { background: #171b21; border: 1px solid #262c35; border-radius: 10px; padding: 12px; }
  .stat b { font-size: 22px; display: block; }
  .stat span { font-size: 12px; color: #8b93a1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #232933; white-space: nowrap; }
  th { color: #8b93a1; font-weight: 500; }
  td.actions button { padding: 4px 10px; font-size: 12px; margin-right: 4px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 12px; }
  .unsold { background: #3b3413; color: #e7c65a; }
  .active { background: #14351f; color: #55c97c; }
  .revoked { background: #3b1717; color: #e07070; }
  .login { max-width: 340px; margin: 16vh auto 0; }
  .toast { position: fixed; top: 16px; right: 16px; background: #1f2733; border: 1px solid #2c333e; padding: 12px 16px; border-radius: 10px; max-width: 380px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.4); white-space: pre-wrap; }
  .gen-result { background: #0f1216; border: 1px dashed #2c333e; border-radius: 8px; padding: 10px; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.7; max-height: 220px; overflow: auto; }
  .empty { color: #5c6470; text-align: center; padding: 28px 0; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: 13px; color: #8b93a1; }
</style>
</head>
<body>
<div id="login" class="card login">
  <h1>激活码管理后台</h1>
  <p class="sub">请输入管理密码</p>
  <div class="row">
    <label style="flex:1">密码<input type="password" id="password" autocomplete="current-password" /></label>
    <button id="login-btn">登录</button>
  </div>
</div>

<div id="app" class="wrap" style="display:none">
  <h1>激活码管理后台</h1>
  <p class="sub">生成激活码 → 线下收款 → 把码发给买家 → 买家在应用中激活即完成设备绑定</p>

  <div class="card">
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <p class="sub" style="margin-bottom:10px">生成激活码</p>
    <div class="row">
      <label>数量<input type="number" id="g-count" value="10" min="1" max="1000" style="width:90px" /></label>
      <label>套餐<input id="g-plan" value="standard" placeholder="standard / pro" /></label>
      <label>有效天数<input type="number" id="g-days" value="365" min="1" max="3650" style="width:100px" /></label>
      <label style="flex:1">备注（可选）<input id="g-note" placeholder="例如：闲鱼 11 月批次" /></label>
      <button id="gen-btn">生成</button>
    </div>
    <div id="gen-result" class="gen-result" style="display:none; margin-top:12px"></div>
    <div class="row" style="margin-top:8px">
      <button class="ghost" id="copy-btn" style="display:none">复制全部</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <label style="flex:1">搜索（码 / 备注 / 设备指纹）<input id="q" placeholder="输入关键字回车" /></label>
      <label>状态
        <select id="status">
          <option value="all">全部</option>
          <option value="unsold">未激活</option>
          <option value="active">已激活</option>
          <option value="revoked">已封禁</option>
        </select>
      </label>
      <button id="search-btn">查询</button>
      <a href="#" id="backup-link" style="color:#8b93a1;font-size:13px;text-decoration:none;align-self:center" title="下载数据库备份文件">下载数据库备份</a>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead>
          <tr><th>激活码</th><th>状态</th><th>套餐</th><th>到期时间</th><th>绑定设备</th><th>最近活跃</th><th>备注</th><th>操作</th></tr>
        </thead>
        <tbody id="codes-body"></tbody>
      </table>
    </div>
    <div class="pager">
      <button class="ghost" id="prev-btn">上一页</button>
      <span id="page-info"></span>
      <button class="ghost" id="next-btn">下一页</button>
    </div>
  </div>
</div>

<div id="toast-slot"></div>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const token = () => sessionStorage.getItem("adminToken") || "";
  const authFetch = (path, opts = {}) => fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", authorization: "Bearer " + token(), ...(opts.headers || {}) },
  });

  function toast(msg) {
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    $("toast-slot").appendChild(el);
    setTimeout(() => el.remove(), 6000);
  }

  function fmtDate(ts) {
    if (!ts) return "—";
    return new Date(ts).toLocaleString("zh-CN", { hour12: false });
  }
  function fmtDays(ts) {
    if (!ts) return "—";
    const d = Math.ceil((ts - Date.now()) / 86400000);
    return d > 0 ? `${new Date(ts).toLocaleDateString("zh-CN")}（剩 ${d} 天）` : `${new Date(ts).toLocaleDateString("zh-CN")}（已到期）`;
  }

  // ---- 登录 ----
  async function login() {
    const res = await fetch("/admin/api/login", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ password: $("password").value }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.message || "登录失败"); return; }
    sessionStorage.setItem("adminToken", data.token);
    $("login").style.display = "none";
    $("app").style.display = "";
    $("backup-link").href = "#";
    $("backup-link").onclick = async (e) => {
      e.preventDefault();
      const r = await authFetch("/admin/api/backup");
      if (!r.ok) { toast("下载失败"); return; }
      const blob = await r.blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "license-backup.db";
      a.click();
      URL.revokeObjectURL(a.href);
    };
    refresh();
  }
  $("login-btn").onclick = login;
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  // ---- 统计 ----
  async function loadStats() {
    const res = await authFetch("/admin/api/stats");
    if (res.status === 401) { location.reload(); return; }
    const s = await res.json();
    const cells = [
      [s.codes.total, "激活码总数"], [s.codes.unsold, "未激活"], [s.codes.active, "已激活"], [s.codes.revoked, "已封禁"],
      [s.devices, "绑定设备"], [s.activeToday, "今日活跃"], [s.activations7d, "7 天激活次数"],
    ];
    $("stats").innerHTML = cells.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  }

  // ---- 生成 ----
  let lastCodes = [];
  $("gen-btn").onclick = async () => {
    const res = await authFetch("/admin/api/codes", {
      method: "POST",
      body: JSON.stringify({
        count: Number($("g-count").value) || 10,
        plan: $("g-plan").value.trim() || "standard",
        durationDays: Number($("g-days").value) || 365,
        note: $("g-note").value.trim(),
      }),
    });
    const data = await res.json();
    if (!res.ok) { toast(data.message || "生成失败"); return; }
    lastCodes = data.codes;
    $("gen-result").style.display = "";
    $("gen-result").textContent = data.codes.join("\n") + `\n\n批次 ${data.batchId}，共 ${data.codes.length} 个`;
    $("copy-btn").style.display = "";
    toast("已生成 " + data.codes.length + " 个激活码");
    refresh();
  };
  $("copy-btn").onclick = async () => {
    await navigator.clipboard.writeText(lastCodes.join("\n"));
    toast("已复制");
  };

  // ---- 列表 ----
  let page = 0;
  let total = 0;
  const PAGE_SIZE = 50;

  async function loadCodes() {
    const params = new URLSearchParams({
      q: $("q").value.trim(),
      status: $("status").value,
      limit: PAGE_SIZE,
      offset: page * PAGE_SIZE,
    });
    const res = await authFetch("/admin/api/codes?" + params);
    if (res.status === 401) { location.reload(); return; }
    const data = await res.json();
    total = data.total;
    const rows = data.items.map((it) => {
      const badge = `<span class="badge ${it.status}">${it.status === "unsold" ? "未激活" : it.status === "active" ? "已激活" : "已封禁"}</span>`;
      const device = it.deviceFingerprint ? (it.deviceName || it.deviceFingerprint.slice(0, 10)) : "—";
      const expiry = it.activatedAt ? fmtDays(it.expiresAt) : `${it.durationDays} 天`;
      const actions = [];
      if (it.deviceFingerprint) actions.push(`<button class="ghost" data-act="unbind" data-code="${it.code}">解绑</button>`);
      if (it.status !== "revoked") actions.push(`<button class="danger" data-act="revoke" data-code="${it.code}">封禁</button>`);
      if (it.status === "revoked") actions.push(`<button class="ghost" data-act="restore" data-code="${it.code}">恢复</button>`);
      if (it.activatedAt) actions.push(`<button class="ghost" data-act="extend" data-code="${it.code}">延期</button>`);
      return `<tr><td style="font-family:ui-monospace,monospace">${it.code}</td><td>${badge}</td><td>${it.plan}</td><td>${expiry}</td><td title="${it.deviceFingerprint || ""}">${device}</td><td>${it.lastSeenAt ? fmtDate(it.lastSeenAt) : "—"}</td><td>${it.note || ""}</td><td class="actions">${actions.join("")}</td></tr>`;
    });
    $("codes-body").innerHTML = rows.length ? rows.join("") : `<tr><td colspan="8" class="empty">暂无记录</td></tr>`;
    $("page-info").textContent = `第 ${page + 1} 页 / 共 ${Math.max(1, Math.ceil(total / PAGE_SIZE))} 页（${total} 条）`;
    $("prev-btn").disabled = page === 0;
    $("next-btn").disabled = (page + 1) * PAGE_SIZE >= total;
  }

  $("codes-body").addEventListener("click", async (e) => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const code = btn.dataset.code;
    const act = btn.dataset.act;
    if (act === "unbind") {
      if (!confirm(`确定解绑 ${code}？解绑后买家可在新设备激活。`)) return;
      await postAction(code, "unbind");
    } else if (act === "revoke") {
      if (!confirm(`确定封禁 ${code}？封禁后该码立即失效。`)) return;
      await postAction(code, "revoke");
    } else if (act === "restore") {
      await postAction(code, "restore");
    } else if (act === "extend") {
      const input = prompt("延期天数（1-3650）：", "30");
      if (!input) return;
      await postAction(code, "extend", { days: Number(input) });
    }
  });

  async function postAction(code, action, body = {}) {
    const res = await authFetch(`/admin/api/codes/${encodeURIComponent(code)}/${action}`, {
      method: "POST",
      body: JSON.stringify(body),
    });
    const data = await res.json();
    toast(data.message || (res.ok ? "操作成功" : "操作失败"));
    refresh();
  }

  $("search-btn").onclick = () => { page = 0; loadCodes(); };
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { page = 0; loadCodes(); } });
  $("status").onchange = () => { page = 0; loadCodes(); };
  $("prev-btn").onclick = () => { if (page > 0) { page -= 1; loadCodes(); } };
  $("next-btn").onclick = () => { page += 1; loadCodes(); };

  function refresh() { loadStats(); loadCodes(); }

  // 已登录则直接进入（刷新页面后 session 仍在）
  if (token()) {
    authFetch("/admin/api/stats").then((r) => {
      if (r.ok) { $("login").style.display = "none"; $("app").style.display = ""; refresh(); }
    });
  }
})();
</script>
</body>
</html>
